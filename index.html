<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Card</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#06131f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    padding:25px 18px;
}

.app{
    width:100%;
    max-width:430px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.header h2{
    font-size:22px;
}

.header span{
    color:#8199a8;
    font-size:12px;
}

/* DEMO LOGIN */

.login-box{
    background:#0b202e;
    border:1px solid #193b4d;
    border-radius:17px;
    padding:20px;
    margin-bottom:22px;
}

.login-box h3{
    font-size:16px;
    margin-bottom:7px;
}

.login-box p{
    color:#8da4b2;
    font-size:12px;
    margin-bottom:15px;
}

.login-box input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #24485a;
    background:#071924;
    color:#fff;
    outline:none;
    margin-bottom:10px;
}

.login-box input:focus{
    border-color:#00bd82;
}

.login-btn{
    width:100%;
    border:0;
    background:linear-gradient(135deg,#00bd82,#087b61);
    color:#fff;
    border-radius:11px;
    padding:13px;
    font-weight:bold;
    cursor:pointer;
}

/* BALANCE */

.balance-box{
    background:#0b202e;
    border:1px solid #193b4d;
    border-radius:17px;
    padding:20px;
    margin-bottom:22px;
}

.balance-label{
    color:#8da4b2;
    font-size:13px;
    margin-bottom:7px;
}

.balance{
    font-size:34px;
    font-weight:700;
}

/* CARD */

.virtual-card{
    position:relative;
    width:100%;
    aspect-ratio:1.586;
    border-radius:22px;
    padding:24px;
    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #102b3b 0%,
        #123e4d 45%,
        #061923 100%
    );

    box-shadow:
    0 22px 45px rgba(0,0,0,.45),
    inset 0 1px 1px rgba(255,255,255,.15);

    transition:.3s;
}

.virtual-card:before{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(0,255,180,.08);
    right:-100px;
    top:-120px;
}

.virtual-card:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(0,150,255,.07);
    left:-100px;
    bottom:-120px;
}

.card-top,
.chip,
.card-number,
.card-info,
.visa{
    position:relative;
    z-index:2;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-type{
    font-size:12px;
    letter-spacing:2px;
    color:#d3e0e7;
}

.contactless{
    font-size:24px;
    transform:rotate(90deg);
    color:#d6e3e8;
}

.chip{
    width:45px;
    height:34px;
    border-radius:7px;
    margin-top:25px;

    background:
    linear-gradient(
        135deg,
        #eee,
        #999,
        #ddd
    );
}

.chip:before{
    content:"";
    position:absolute;
    width:100%;
    height:1px;
    background:#777;
    top:50%;
}

.chip:after{
    content:"";
    position:absolute;
    height:100%;
    width:1px;
    background:#777;
    left:50%;
}

.card-number{
    margin-top:19px;
    font-family:monospace;
    font-size:19px;
    letter-spacing:2px;
}

.card-info{
    position:absolute;
    left:24px;
    bottom:23px;
    display:flex;
    gap:24px;
}

.info-label{
    font-size:8px;
    color:#8da6b4;
    letter-spacing:1px;
    margin-bottom:4px;
}

.info-value{
    font-size:11px;
    letter-spacing:1px;
}

.visa{
    position:absolute;
    right:23px;
    bottom:18px;
    font-size:29px;
    font-weight:900;
    font-style:italic;
    letter-spacing:-2px;
}

/* CARD STATUS */

.card-status{
    position:absolute;
    top:18px;
    right:20px;
    z-index:5;
    background:rgba(0,0,0,.25);
    padding:5px 9px;
    border-radius:20px;
    font-size:9px;
    letter-spacing:.5px;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

button{
    border:1px solid #1c4153;
    background:#0d2737;
    color:#fff;
    border-radius:13px;
    padding:14px 10px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#12384b;
}

.primary{
    background:linear-gradient(
        135deg,
        #00bd82,
        #087b61
    );
    border:none;
}

.primary:hover{
    background:linear-gradient(
        135deg,
        #00d692,
        #098c6d
    );
}

.status{
    text-align:center;
    color:#7f98a7;
    font-size:12px;
    margin-top:15px;
}

/* FROZEN */

.frozen{
    opacity:.55;
    filter:grayscale(.7);
}

/* HIDDEN */

.hidden{
    display:none;
}

/* MOBILE */

@media(max-width:380px){

    .virtual-card{
        padding:19px;
    }

    .card-number{
        font-size:15px;
        letter-spacing:1.5px;
    }

    .card-info{
        left:19px;
        bottom:18px;
        gap:17px;
    }

    .visa{
        right:18px;
        bottom:15px;
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <h2>Virtual Card</h2>
        <span>Demo Debit Card</span>
    </div>


    <!-- DEMO ACCOUNT -->

    <div class="login-box" id="loginBox">

        <h3>Demo Account</h3>

        <p>
            Create or sign in to the local demo account.
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="off"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            Sign In
        </button>

    </div>


    <!-- BALANCE -->

    <div class="balance-box">

        <div class="balance-label">
            Available Balance
        </div>

        <div
            class="balance"
            id="balance"
        >
            $0.00
        </div>

    </div>


    <!-- VIRTUAL CARD -->

    <div
        class="virtual-card"
        id="virtualCard"
    >

        <div class="card-status" id="cardStatus">
            ACTIVE
        </div>

        <div class="card-top">

            <div class="card-type">
                VIRTUAL DEBIT
            </div>

            <div class="contactless">
                )))
            </div>

        </div>


        <div class="chip"></div>


        <div
            class="card-number"
            id="cardNumber"
        >
            •••• •••• •••• ••••
        </div>


        <div class="card-info">

            <div>

                <div class="info-label">
                    CARD HOLDER
                </div>

                <div
                    class="info-value"
                    id="cardHolder"
                >
                    CARD HOLDER
                </div>

            </div>


            <div>

                <div class="info-label">
                    EXPIRES
                </div>

                <div
                    class="info-value"
                    id="expiry"
                >
                    ••/••
                </div>

            </div>


            <div>

                <div class="info-label">
                    CVV
                </div>

                <div
                    class="info-value"
                    id="cvv"
                >
                    •••
                </div>

            </div>

        </div>


        <div class="visa">
            VISA
        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="primary"
            onclick="toggleDetails()"
        >
            Show Details
        </button>


        <button onclick="copyCardNumber()">
            Copy Number
        </button>


        <button onclick="freezeCard()">
            Freeze Card
        </button>


        <button onclick="fetchBalance()">
            Refresh Balance
        </button>

    </div>


    <div
        class="status"
        id="status"
    >
        Demo account not signed in
    </div>

</div>


<script>

/*
====================================================
LOCAL STORAGE DEMO ACCOUNT
====================================================
*/

const DEMO_USERNAME = "demo";

const DEMO_PASSWORD = "demo123";


/*
====================================================
INITIAL DEMO BALANCE
====================================================

The balance is created only once.

Changing it later will persist in this browser.
*/

if(localStorage.getItem("demoBalance") === null){

    localStorage.setItem(
        "demoBalance",
        "250000"
    );

}


/*
====================================================
CARD INFORMATION
====================================================

This is fictional/demo information.
The number below is a commonly used payment-network
test number and is not a live payment card.
*/

const cardData = {

    number:"4242 4242 4242 4242",

    holder:"DEMO USER",

    expiry:"12/29",

    cvv:"123"

};


let detailsVisible = false;

let frozen =
    localStorage.getItem("cardFrozen") === "true";


/*
====================================================
LOGIN
====================================================
*/

function login(){

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if(
        username === DEMO_USERNAME &&
        password === DEMO_PASSWORD
    ){

        localStorage.setItem(
            "demoLoggedIn",
            "true"
        );


        document.getElementById(
            "loginBox"
        ).classList.add("hidden");


        document.getElementById(
            "status"
        ).textContent =
            frozen
            ? "Demo account signed in — Card frozen"
            : "Demo account signed in";


        fetchBalance();


    }else{

        document.getElementById(
            "status"
        ).textContent =
            "Invalid demo username or password";

    }

}


/*
====================================================
CHECK LOGIN
====================================================
*/

function checkLogin(){

    const loggedIn =
        localStorage.getItem(
            "demoLoggedIn"
        ) === "true";


    if(loggedIn){

        document.getElementById(
            "loginBox"
        ).classList.add("hidden");

    }

}


/*
====================================================
FETCH BALANCE FROM LOCAL STORAGE
====================================================
*/

function fetchBalance(){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Fetching balance...";


    setTimeout(function(){

        const storedBalance =
            localStorage.getItem(
                "demoBalance"
            );


        const balance =
            Number(storedBalance || 0);


        document.getElementById(
            "balance"
        ).textContent =
            "$" +
            balance.toLocaleString(
                "en-US",
                {
                    minimumFractionDigits:2,
                    maximumFractionDigits:2
                }
            );


        status.textContent =
            frozen
            ? "Balance updated — Card frozen"
            : "Balance updated";


    },300);

}


/*
====================================================
SHOW / HIDE CARD DETAILS
====================================================
*/

function toggleDetails(){

    detailsVisible =
        !detailsVisible;


    document.getElementById(
        "cardNumber"
    ).textContent =
        detailsVisible
        ? cardData.number
        : "•••• •••• •••• ••••";


    document.getElementById(
        "cardHolder"
    ).textContent =
        detailsVisible
        ? cardData.holder
        : "CARD HOLDER";


    document.getElementById(
        "expiry"
    ).textContent =
        detailsVisible
        ? cardData.expiry
        : "••/••";


    document.getElementById(
        "cvv"
    ).textContent =
        detailsVisible
        ? cardData.cvv
        : "•••";


    document.querySelector(
        ".primary"
    ).textContent =
        detailsVisible
        ? "Hide Details"
        : "Show Details";

}


/*
====================================================
COPY CARD NUMBER
====================================================
*/

function copyCardNumber(){

    if(!detailsVisible){

        document.getElementById(
            "status"
        ).textContent =
            "Show card details first";

        return;

    }


    navigator.clipboard
        .writeText(cardData.number)
        .then(function(){

            document.getElementById(
                "status"
            ).textContent =
                "Demo card number copied";

            setTimeout(function(){

                document.getElementById(
                    "status"
                ).textContent =
                    frozen
                    ? "Card frozen"
                    : "Card active";

            },2000);

        });

}


/*
====================================================
FREEZE / UNFREEZE CARD
====================================================
*/

function freezeCard(){

    frozen = !frozen;


    localStorage.setItem(
        "cardFrozen",
        frozen
    );


    const card =
        document.getElementById(
            "virtualCard"
        );


    const cardStatus =
        document.getElementById(
            "cardStatus"
        );


    if(frozen){

        card.classList.add(
            "frozen"
        );

        cardStatus.textContent =
            "FROZEN";

        document.getElementById(
            "status"
        ).textContent =
            "Card frozen";


    }else{

        card.classList.remove(
            "frozen"
        );

        cardStatus.textContent =
            "ACTIVE";

        document.getElementById(
            "status"
        ).textContent =
            "Card active";

    }

}


/*
====================================================
SET DEMO BALANCE
====================================================

For testing from the browser console:

setCardBalance(50000)

The value persists in localStorage.
*/

function setCardBalance(amount){

    const value =
        Number(amount);


    if(
        !Number.isFinite(value) ||
        value < 0
    ){

        return;

    }


    localStorage.setItem(
        "demoBalance",
        value.toString()
    );


    fetchBalance();

}


/*
====================================================
INITIALIZE
====================================================
*/

checkLogin();

fetchBalance();


/*
====================================================
RESTORE FROZEN STATE
====================================================
*/

if(frozen){

    document.getElementById(
        "virtualCard"
    ).classList.add("frozen");


    document.getElementById(
        "cardStatus"
    ).textContent =
        "FROZEN";

}

</script>

</body>
  </html>
